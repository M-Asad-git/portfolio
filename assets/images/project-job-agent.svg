<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 60 H600 M0 120 H600 M0 180 H600 M0 240 H600 M0 300 H600" stroke="#334155" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <path d="M100 0 V360 M200 0 V360 M300 0 V360 M400 0 V360 M500 0 V360" stroke="#334155" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Code / Terminal Window Box -->
  <rect x="40" y="35" width="520" height="290" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
  
  <!-- Terminal Header -->
  <rect x="40" y="35" width="520" height="36" rx="12" fill="#0f172a"/>
  <circle cx="62" cy="53" r="5" fill="#ef4444"/>
  <circle cx="78" cy="53" r="5" fill="#f59e0b"/>
  <circle cx="94" cy="53" r="5" fill="#10b981"/>
  <text x="120" y="58" fill="#94a3b8" font-family="monospace" font-size="12">agent.py — Remote Job Bot [LinkedIn / ATS / Slack]</text>
  
  <!-- Status Badge -->
  <rect x="440" y="44" width="105" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
  <circle cx="452" cy="54" r="3.5" fill="#10b981"/>
  <text x="462" y="58" fill="#10b981" font-family="monospace" font-weight="bold" font-size="11">ACTIVE BOT</text>

  <!-- Agent Flow Graphic -->
  <!-- Scraper Card -->
  <rect x="65" y="95" width="130" height="90" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="77" y="122" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="12">1. ATS &amp; LinkedIn</text>
  <text x="77" y="142" fill="#94a3b8" font-family="monospace" font-size="10">Scrape Jobs</text>
  <text x="77" y="160" fill="#64748b" font-family="monospace" font-size="9">Hourly Cron</text>

  <!-- Arrow 1 -->
  <path d="M200 140 L235 140" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="235,136 245,140 235,144" fill="#06b6d4"/>

  <!-- AI Matching Engine Card -->
  <rect x="250" y="85" width="130" height="110" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="262" y="112" fill="#a855f7" font-family="sans-serif" font-weight="bold" font-size="12">2. Match Engine</text>
  <text x="262" y="132" fill="#cbd5e1" font-family="monospace" font-size="10">Custom Skills Filter</text>
  <text x="262" y="150" fill="#cbd5e1" font-family="monospace" font-size="10">Role &amp; Salary Match</text>
  <text x="262" y="172" fill="#10b981" font-family="monospace" font-size="9">✓ 98% Relevance</text>

  <!-- Arrow 2 -->
  <path d="M385 140 L420 140" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="420,136 430,140 420,144" fill="#06b6d4"/>

  <!-- Notification Dispatcher Card -->
  <rect x="435" y="95" width="110" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
  <text x="445" y="122" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12">3. Alerts</text>
  <text x="445" y="142" fill="#cbd5e1" font-family="monospace" font-size="10">Slack Webhook</text>
  <text x="445" y="160" fill="#cbd5e1" font-family="monospace" font-size="10">Daily Email</text>

  <!-- Terminal log output at bottom -->
  <rect x="65" y="215" width="480" height="90" rx="6" fill="#090d16"/>
  <text x="80" y="238" fill="#10b981" font-family="monospace" font-size="11">$ python bot_agent.py --target="remote_engineer"</text>
  <text x="80" y="258" fill="#67e8f9" font-family="monospace" font-size="10">[✓] Fetched 42 listings from LinkedIn &amp; Greenhouse ATS</text>
  <text x="80" y="276" fill="#a78bfa" font-family="monospace" font-size="10">[✓] 12 High Match Roles Dispatched to #dev-job-alerts (Slack)</text>
  <text x="80" y="294" fill="#facc15" font-family="monospace" font-size="10">[✓] Daily subscriber email digest delivered successfully</text>
</svg>
