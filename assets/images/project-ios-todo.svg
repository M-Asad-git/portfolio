<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="iosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#iosBg)"/>
  
  <rect x="35" y="30" width="530" height="300" rx="10" fill="#090d16" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="35" y="30" width="530" height="36" rx="10" fill="#0f172a"/>
  <circle cx="55" cy="48" r="4.5" fill="#ef4444"/>
  <circle cx="70" cy="48" r="4.5" fill="#f59e0b"/>
  <circle cx="85" cy="48" r="4.5" fill="#10b981"/>
  <text x="110" y="52" fill="#94a3b8" font-family="monospace" font-size="11">M-Asad-git/ios_native_todo — Swift / iOS Native</text>

  <!-- iPhone Frame Mockup -->
  <g transform="translate(195, 75)">
    <rect width="210" height="235" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Dynamic Island / Notch -->
    <rect x="65" y="10" width="80" height="14" rx="7" fill="#000000"/>
    
    <text x="25" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="16">My Tasks</text>
    <text x="25" y="65" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Today's Focus • Swift Native</text>

    <!-- iOS List Item 1 -->
    <rect x="18" y="78" width="174" height="34" rx="8" fill="#0f172a"/>
    <circle cx="34" cy="95" r="7" fill="#38bdf8"/>
    <text x="48" y="99" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10">AI Semester Exam Prep</text>

    <!-- iOS List Item 2 -->
    <rect x="18" y="118" width="174" height="34" rx="8" fill="#0f172a"/>
    <circle cx="34" cy="135" r="7" fill="#a855f7"/>
    <text x="48" y="139" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10">TriTechTeal Client Review</text>

    <!-- iOS List Item 3 -->
    <rect x="18" y="158" width="174" height="34" rx="8" fill="#0f172a"/>
    <circle cx="34" cy="175" r="7" fill="#10b981"/>
    <text x="48" y="179" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10">Update Remote Job Agent</text>

    <!-- Home Indicator -->
    <rect x="65" y="220" width="80" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Left tech badge -->
  <g transform="translate(55, 120)">
    <text x="0" y="0" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">Swift Native</text>
    <text x="0" y="20" fill="#94a3b8" font-family="monospace" font-size="11">UIKit &amp; SwiftUI</text>
    <text x="0" y="38" fill="#94a3b8" font-family="monospace" font-size="11">Haptic Engine</text>
    <text x="0" y="56" fill="#94a3b8" font-family="monospace" font-size="11">Local Storage</text>
  </g>

  <!-- Right badge -->
  <g transform="translate(435, 120)">
    <text x="0" y="0" fill="#a78bfa" font-family="sans-serif" font-weight="bold" font-size="14">Apple UX</text>
    <text x="0" y="20" fill="#94a3b8" font-family="monospace" font-size="11">120Hz ProMotion</text>
    <text x="0" y="38" fill="#94a3b8" font-family="monospace" font-size="11">Swipe Gestures</text>
    <text x="0" y="56" fill="#94a3b8" font-family="monospace" font-size="11">Private Repo</text>
  </g>
</svg>
