<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="brBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#brBg)"/>
  
  <rect x="35" y="30" width="530" height="300" rx="10" fill="#18181b" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="35" y="30" width="530" height="30" rx="10" fill="#27272a"/>
  <circle cx="55" cy="45" r="4.5" fill="#ef4444"/>
  <circle cx="70" cy="45" r="4.5" fill="#f59e0b"/>
  <circle cx="85" cy="45" r="4.5" fill="#10b981"/>
  <text x="110" y="49" fill="#a1a1aa" font-family="sans-serif" font-size="10">https://brightexx.com/</text>

  <!-- Title -->
  <text x="65" y="95" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="20">BRIGHTEXX GLOBAL</text>
  <text x="65" y="117" fill="#fb923c" font-family="sans-serif" font-size="12">International Trade, Manufacturing &amp; Global B2B Export</text>

  <!-- Global Trade Cards -->
  <g transform="translate(65, 135)">
    <rect width="470" height="170" rx="8" fill="#27272a" stroke="#3f3f46"/>
