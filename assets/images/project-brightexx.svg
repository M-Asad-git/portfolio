    <line x1="20" y1="85" x2="110" y2="85" stroke="#f97316" stroke-width="1"/>
    
    <text x="135" y="55" fill="#fafafa" font-family="sans-serif" font-weight="bold" font-size="14">Worldwide Export Supply Chain</text>
    <text x="135" y="80" fill="#a1a1aa" font-family="sans-serif" font-size="11">• Certified Quality Standards &amp; Bulk Shipment</text>
    <text x="135" y="102" fill="#a1a1aa" font-family="sans-serif" font-size="11">• Multi-Category Commercial Product Catalog</text>
    <text x="135" y="124" fill="#a1a1aa" font-family="sans-serif" font-size="11">• Automated International Quotation &amp; Inquiries</text>
    
    <rect x="135" y="138" width="130" height="20" rx="4" fill="url(#orgGrad)"/>
    <text x="200" y="152" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">VIEW CATALOG &gt;</text>
