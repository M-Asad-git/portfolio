<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <!-- Background Circle with Glow -->
  <circle cx="150" cy="150" r="145" fill="#080c17" stroke="url(#avatarBg)" stroke-width="6"/>
  <circle cx="150" cy="150" r="135" fill="url(#faceGrad)"/>

  <!-- Developer Icon / Monogram -->
  <!-- Tech Aura Rings -->
  <circle cx="150" cy="150" r="115" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4"/>
  <circle cx="150" cy="150" r="95" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity="0.4"/>

  <!-- Central Initials / Visual Logo -->
  <text x="150" y="140" fill="url(#avatarBg)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="2">MA</text>
  <text x="150" y="175" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle" letter-spacing="3">MUHAMMAD ASAD</text>
  <text x="150" y="195" fill="#38bdf8" font-family="monospace" font-weight="600" font-size="11" text-anchor="middle">AI &amp; WEB ENGINEER</text>

  <!-- Floating Code Dots & Tag Icons -->
  <g transform="translate(150, 230)">
    <rect x="-65" y="-12" width="130" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <circle cx="-48" cy="0" r="3.5" fill="#10b981"/>
    <text x="0" y="4" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">AVAILABLE FOR WORK</text>
  </g>
</svg>
