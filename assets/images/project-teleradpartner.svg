      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#tpBg)"/>
  
  <rect x="35" y="30" width="530" height="300" rx="10" fill="#0f172a" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
