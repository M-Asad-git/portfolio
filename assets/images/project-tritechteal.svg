<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tttBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#tttBg)"/>
  
  <rect x="35" y="30" width="530" height="300" rx="10" fill="#1e293b" stroke="#14b8a6" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="35" y="30" width="530" height="36" rx="10" fill="#0f172a"/>
  <circle cx="55" cy="48" r="4.5" fill="#ef4444"/>
  <circle cx="70" cy="48" r="4.5" fill="#f59e0b"/>
  <circle cx="85" cy="48" r="4.5" fill="#10b981"/>
  <text x="110" y="52" fill="#94a3b8" font-family="monospace" font-size="11">tritechteal.com — Enterprise AI, Cloud &amp; Web</text>

  <!-- Logo and title -->
  <circle cx="75" cy="100" r="16" fill="url(#tealGrad)"/>
  <text x="75" y="106" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="16" text-anchor="middle">TT</text>
  <text x="105" y="106" fill="#f8fafc" font-family="monospace" font-weight="bold" font-size="20">TRITECHTEAL</text>

  <!-- Terminal Loader Box inside -->
  <rect x="65" y="130" width="470" height="175" rx="8" fill="#090d16" stroke="#334155"/>
