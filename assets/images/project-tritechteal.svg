  <text x="85" y="180" fill="#94a3b8" font-family="monospace" font-size="11">Initializing enterprise systems...</text>
  <text x="85" y="202" fill="#38bdf8" font-family="monospace" font-size="11">✓ AI models &amp; agentic workflows loaded</text>
  <text x="85" y="222" fill="#34d399" font-family="monospace" font-size="11">✓ Cloud infrastructure &amp; Go microservices ready</text>
  <text x="85" y="242" fill="#a78bfa" font-family="monospace" font-size="11">✓ Next.js client portals synchronized</text>
  
  <rect x="85" y="265" width="280" height="16" rx="8" fill="#1e293b"/>
  <rect x="85" y="265" width="220" height="16" rx="8" fill="url(#tealGrad)"/>
  <text x="380" y="278" fill="#14b8a6" font-family="monospace" font-size="11">100% OPERATIONAL</text>
