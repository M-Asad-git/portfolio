      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#reBg)"/>
  
  <rect x="35" y="30" width="530" height="300" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
