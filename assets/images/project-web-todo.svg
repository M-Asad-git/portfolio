<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="todoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="todoAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#todoBg)"/>
  
  <rect x="35" y="30" width="530" height="300" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="35" y="30" width="530" height="36" rx="10" fill="#1e293b"/>
  <circle cx="55" cy="48" r="4.5" fill="#ef4444"/>
  <circle cx="70" cy="48" r="4.5" fill="#f59e0b"/>
  <circle cx="85" cy="48" r="4.5" fill="#10b981"/>
  <text x="110" y="52" fill="#94a3b8" font-family="monospace" font-size="11">az25lab/todo — Web Productivity Suite</text>

  <!-- Todo List Mockup -->
  <g transform="translate(65, 85)">
    <!-- Add Task Input -->
    <rect width="470" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="26" fill="#64748b" font-family="sans-serif" font-size="12">+ Add new high-priority development sprint...</text>
    <rect x="385" y="6" width="75" height="30" rx="6" fill="url(#todoAcc)"/>
    <text x="422" y="25" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">Add Task</text>

    <!-- Task Items -->
    <g transform="translate(0, 58)">
      <rect width="470" height="40" rx="6" fill="#1e293b" stroke="#10b981"/>
      <circle cx="20" cy="20" r="8" fill="#10b981"/>
      <path d="M16 20 L19 23 L25 17" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="40" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12" text-decoration="line-through">Deploy Remote Job Scraper to production</text>
      <rect x="390" y="10" width="65" height="20" rx="4" fill="#10b981" fill-opacity="0.2"/>
      <text x="422" y="24" fill="#10b981" font-family="sans-serif" font-size="10" text-anchor="middle">COMPLETED</text>
    </g>

    <g transform="translate(0, 106)">
      <rect width="470" height="40" rx="6" fill="#1e293b" stroke="#3b82f6"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
      <text x="40" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12">Refactor Global eTelerad PACS components</text>
      <rect x="400" y="10" width="55" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="427" y="24" fill="#60a5fa" font-family="sans-serif" font-size="10" text-anchor="middle">IN PROGRESS</text>
    </g>

    <g transform="translate(0, 154)">
      <rect width="470" height="40" rx="6" fill="#1e293b" stroke="#334155"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="40" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="12">Train new LLM conversational context prompt</text>
      <rect x="405" y="10" width="50" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="430" y="24" fill="#f59e0b" font-family="sans-serif" font-size="10" text-anchor="middle">QUEUED</text>
    </g>
  </g>
</svg>
